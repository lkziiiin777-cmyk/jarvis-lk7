<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS LK7 — V2</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #02070b;
    color: #eaf8ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 55px 20px 30px;
    text-align: center;
}

h1 {
    font-size: 42px;
    letter-spacing: 7px;
    margin-bottom: 12px;
    text-shadow:
        0 0 8px #49cfff,
        0 0 25px #168dcc;
}

.sub {
    color: #91a5b0;
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 75px;
}

.core {
    width: 230px;
    height: 230px;
    border-radius: 50%;
    border: 3px solid #42c9ff;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 65px;

    box-shadow:
        0 0 15px #159bd9,
        0 0 45px #075f91,
        inset 0 0 35px #073c59;

    animation: pulse 2.5s infinite ease-in-out;
}

.core::before {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    border: 1px solid #42c9ff;
    box-shadow: 0 0 25px #159bd9;
    animation: rotate 8s linear infinite;
}

.core::after {
    content: "";
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 15px #42c9ff;
    background: #07131a;
    z-index: 2;
}

button {
    background: #07151d;
    color: white;
    border: 2px solid #42c9ff;
    border-radius: 50px;
    padding: 17px 32px;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: .5px;
    cursor: pointer;

    box-shadow:
        0 0 10px #12698b,
        inset 0 0 10px #06384d;

    transition: .2s;
}

button:active {
    transform: scale(.96);
}

button:hover {
    box-shadow:
        0 0 20px #159bd9,
        inset 0 0 15px #0a4058;
}

.status {
    margin-top: 35px;
    min-height: 28px;
    font-size: 17px;
    color: #b9d5df;
}

.status span {
    color: #42c9ff;
    font-weight: bold;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        box-shadow:
            0 0 15px #159bd9,
            0 0 45px #075f91,
            inset 0 0 35px #073c59;
    }

    50% {
        transform: scale(1.035);
        box-shadow:
            0 0 25px #42c9ff,
            0 0 70px #075f91,
            inset 0 0 45px #0b587a;
    }
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 500px) {
    h1 {
        font-size: 34px;
        letter-spacing: 5px;
    }

    .sub {
        font-size: 15px;
        margin-bottom: 60px;
    }

    .core {
        width: 205px;
        height: 205px;
    }
}
</style>
</head>

<body>

<div class="app">

    <h1>JARVIS LK7</h1>

    <div class="sub">
        ASSISTENTE PESSOAL • V2
    </div>

    <div class="core" id="core"></div>

    <button id="talk">
        🎙️ FALAR COM O JARVIS
    </button>

    <div class="status" id="status">
        Status: <span>PRONTO</span>
    </div>

</div>

<script>

const talk = document.getElementById("talk");
const core = document.getElementById("core");
const status = document.getElementById("status");

let ouvindo = false;

talk.onclick = function() {

    if (!ouvindo) {

        ouvindo = true;

        status.innerHTML =
            'Status: <span>OUVINDO...</span>';

        talk.innerHTML =
            "🔵 JARVIS ESTÁ OUVINDO";

        core.style.animationDuration = "0.8s";

        setTimeout(() => {

            ouvindo = false;

            status.innerHTML =
                'Status: <span>PRONTO</span>';

            talk.innerHTML =
                "🎙️ FALAR COM O JARVIS";

            core.style.animationDuration = "2.5s";

        }, 3000);

    }

};

</script>

</body>
</html>

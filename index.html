<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#02070b">
<title>JARVIS LK7 V2</title>

<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;background:#02070b;color:#eaf8ff;
font-family:Arial,sans-serif;display:flex;justify-content:center
}
.app{
width:100%;max-width:600px;min-height:100vh;padding:40px 20px;
display:flex;flex-direction:column;align-items:center;text-align:center
}
h1{
font-size:38px;letter-spacing:7px;margin:15px 0 8px;
text-shadow:0 0 10px #49cfff,0 0 30px #168dcc
}
.sub{opacity:.55;letter-spacing:2px}
.core{
width:220px;height:220px;border-radius:50%;margin:55px 0 35px;
border:2px solid #42c9ff;display:flex;align-items:center;
justify-content:center;position:relative;
box-shadow:0 0 20px #159bd9,0 0 60px #075f91,inset 0 0 40px #073c59;
animation:pulse 2.5s infinite ease-in-out
}
.core:before{
content:"";position:absolute;width:165px;height:165px;border-radius:50%;
border:1px solid #42c9ff;animation:spin 7s linear infinite
}
.core:after{
content:"";width:25px;height:25px;border-radius:50%;
background:white;box-shadow:0 0 20px #42c9ff;z-index:2
}
.listening{animation:pulse .7s infinite alternate!important}
@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.05)}
}
@keyframes spin{to{transform:rotate(360deg)}}
button{
background:#07151d;color:white;border:1px solid #42c9ff;
border-radius:50px;padding:16px 25px;font-size:16px;font-weight:bold;
box-shadow:0 0 18px #12698b;cursor:pointer
}
button:active{transform:scale(.96)}
#status{margin:25px 0;min-height:30px}
.history{
width:100%;margin-top:15px;border:1px solid #153544;
border-radius:15px;padding:15px;text-align:left;background:#050d12
}
.title{font-size:11px;letter-spacing:2px;opacity:.5;margin-bottom:8px}
#logs{font-size:13px;line-height:1.7;max-height:130px;overflow:auto}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.quick button{font-size:12px;padding:10px 14px}
</style>
</head>

<body>

<div class="app">

<h1>JARVIS LK7</h1>
<div class="sub">ASSISTENTE PESSOAL • V2</div>

<div class="core" id="core"></div>

<button id="talk">🎙️ FALAR COM O JARVIS</button>

<div id="status">Status: <b>PRONTO</b></div>

<div class="quick">
<button onclick="abrir('Instagram')">Instagram</button>
<button onclick="abrir('YouTube')">YouTube</button>
<button onclick="abrir('WhatsApp')">WhatsApp</button>
<button onclick="abrir('Google')">Google</button>
</div>

<div class="history">
<div class="title">HISTÓRICO</div>
<div id="logs">Nenhum comando ainda.</div>
</div>

</div>

<script>

const talk=document.getElementById("talk");
const core=document.getElementById("core");
const status=document.getElementById("status");
const logs=document.getElementById("logs");

function falar(texto){

status.innerHTML="JARVIS: <b>"+texto+"</b>";

if("speechSynthesis" in window){

speechSynthesis.cancel();

let voz=new SpeechSynthesisUtterance(texto);
voz.lang="pt-BR";
voz.rate=.95;
voz.pitch=1;

speechSynthesis.speak(voz);
}

}

function registrar(texto){

if(logs.textContent==="Nenhum comando ainda.")
logs.innerHTML="";

logs.innerHTML="• "+texto+"<br>"+logs.innerHTML;

}

function abrir(app){

const links={
Instagram:"https://www.instagram.com/",
YouTube:"https://www.youtube.com/",
WhatsApp:"https://web.whatsapp.com/",
Google:"https://www.google.com/"
};

registrar("Abrindo "+app);
falar("Abrindo "+app+".");

setTimeout(()=>{
window.location.href=links[app];
},700);

}

function executar(comando){

const original=comando;
comando=comando.toLowerCase();

registrar("Você: "+original);

if(comando.includes("instagram")){
abrir("Instagram");
return;
}

if(comando.includes("youtube")){
abrir("YouTube");
return;
}

if(comando.includes("whatsapp")){
abrir("WhatsApp");
return;
}

if(comando.includes("google")){
abrir("Google");
return;
}

if(comando.includes("pesquisar")||comando.includes("pesquise")){

let pesquisa=comando
.replace("jarvis","")
.replace("pesquisar","")
.replace("pesquise","")
.trim();

if(pesquisa){

falar("Pesquisando por "+pesquisa+".");

setTimeout(()=>{
window.location.href=
"https://www.google.com/search?q="+
encodeURIComponent(pesquisa);
},800);

}else{

falar("O que você quer pesquisar?");
}

return;
}

if(comando.includes("hora")||comando.includes("horas")){

let hora=new Date().toLocaleTimeString(
"pt-BR",
{hour:"2-digit",minute:"2-digit"}
);

falar("Agora são "+hora+".");

return;
}

if(comando.includes("data")||comando.includes("dia")){

let data=new Date().toLocaleDateString(
"pt-BR",
{day:"2-digit",month:"long",year:"numeric"}
);

falar("Hoje é "+data+".");

return;
}

if(comando.includes("quem é você")||
comando.includes("quem e voce")){

falar("Eu sou o JARVIS LK7, seu assistente pessoal.");

return;
}

if(comando.includes("olá")||
comando.includes("ola")||
comando==="oi"){

falar("Olá, LK7. Estou pronto.");

return;
}

falar("Não reconheci esse comando ainda.");

}

const Reconhecimento=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(Reconhecimento){

const reconhecimento=new Reconhecimento();

reconhecimento.lang="pt-BR";
reconhecimento.interimResults=false;
reconhecimento.maxAlternatives=1;

reconhecimento.onstart=function(){

core.classList.add("listening");
talk.textContent="🔵 OUVINDO...";
status.innerHTML="Status: <b>OUVINDO</b>";

};

reconhecimento.onend=function(){

core.classList.remove("listening");
talk.textContent="🎙️ FALAR COM O JARVIS";

};

reconhecimento.onerror=function(){

core.classList.remove("listening");
talk.textContent="🎙️ FALAR COM O JARVIS";

falar("Não consegui entender. Tente novamente.");

};

reconhecimento.onresult=function(event){

const texto=
event.results[0][0].transcript;

executar(texto);

};

talk.onclick=function(){

try{
reconhecimento.start();
}catch(e){}

};

}else{

talk.onclick=function(){

falar(
"Seu navegador não suporta reconhecimento de voz. Use o Chrome."
);

};

}

</script>

</body>
</html>
